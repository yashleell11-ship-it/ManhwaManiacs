# ManhwaManiacs — OVH VPS (Vint Hill) deployment.
#
# Co-tenant on the box that runs the Minecraft bots. Reuses their edge:
# Caddy + cloudflared already run in the `mcbots` compose project on the
# `mcbots_bots` network (see /opt/mcbots/docker-compose.yml). This stack
# joins that network so Caddy can reverse-proxy to it and the tunnel can
# reach it — nothing is published to a host port.
#
# Deploy:  ops/vps/deploy.sh         (run on the VPS, from the repo checkout)
#
# State: only the metadata SQLite DB + settings.json, on the dedicated 50 GB
# disk mounted at /srv/manhwamaniacs. Chapter images are never stored
# server-side (clients download them through the source image proxy).

name: manhwamaniacs

services:
  backend:
    build:
      context: ../../backend
    image: local/manhwamaniacs-backend:latest
    container_name: manhwamaniacs-backend
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    environment:
      - APP_ENV=production
      - MM_DB_PATH=/data/manhwamaniacs.db
      - MM_SETTINGS_PATH=/data/settings.json
      - MM_COOKIE_SECURE=true
      # OPEN, and deliberately so: the owner wants anyone who finds the site
      # to be able to sign up, and re-confirmed that on 2026-09-06 when an
      # audit flagged it. Do not "fix" this back to closed.
      #
      # What that costs, so the next reader knows it was priced in: with no
      # invite code set, anyone on the internet can create an account. A new
      # account is an ordinary user — `is_admin` is only ever granted to the
      # FIRST registration (`user_count == 0`), and the owner account already
      # exists, so this is not an admin path while the users table is
      # populated. The empty-table case is what MM_BOOTSTRAP_WINDOW_MINUTES
      # below bounds.
      - MM_REGISTRATION_ENABLED=true
      # To restrict signup later without closing it: `ops/vps/deploy.sh
      # set-invite-code` generates a strong code and persists it in
      # /data/settings.json (never in git). Only people given the code could
      # then register. An MM_REGISTRATION_INVITE_CODE env line here would win
      # over that file, which is why there isn't one.
      # If the users table is ever empty (fresh disk, reset-accounts), the
      # first UNINVITED registration is only accepted for this many minutes —
      # after that the empty table stops being a public admin-takeover window
      # and normal registration/invite rules apply (create-owner always works).
      # 0 disables uninvited bootstrap entirely. Default 30.
      # - MM_BOOTSTRAP_WINDOW_MINUTES=30
      # http.ts sends credentials:include; 1a rejects a wildcard outside debug.
      - CORS_ORIGINS=https://manhwamaniacs.xyz
      # Baked into the SideStore/APK manifest links the phone fetches (1c).
      - MM_PUBLIC_BASE_URL=https://app.manhwamaniacs.xyz
      - MM_APK_PATH=/app/apk/app-release.apk
      - MM_IPA_PATH=/app/ipa/ManhwaManiacs.ipa
      - MM_PUBSPEC_PATH=/app/mobile/pubspec.yaml
      # REPO_ROOT resolves to / inside this image (code lives at /app), so the
      # config's REPO_ROOT-relative default lands on /mobile/... and misses the
      # mount. Both media paths must be explicit or the SideStore listing shows
      # a blank icon and broken screenshots.
      - MM_SCREENSHOTS_DIR=/app/mobile/screenshots
      # Novels (spec 1d). The owner is the only user of this instance and asked
      # for the novel reader on the live site to review it; registration is
      # closed, so "live" means visible to him after login. Flipping this to
      # false hides every novel source and unmounts the /novels router.
      - MM_NOVELS_ENABLED=true
      # Novel attribution + AI reading suggestions. Read by deepseek_client.py
      # via os.getenv ONLY -- never through Settings, which is written back to
      # settings.json and would land the key in every DB backup. `${...:-}`
      # comes from an untracked `.env` in THIS file's own directory (verified
      # against the real compose binary: it resolves relative to the compose
      # file, same as the `../../backend` build contexts below, not to the
      # caller's cwd -- deploy.sh cd's to the repo root first, which is not
      # this directory). `.env` is in .gitignore, so this line commits with no
      # key attached and both features degrade to "not configured" until one
      # is placed on the box by hand: ops/vps/.env, one line,
      # DEEPSEEK_API_KEY=..., then `docker compose ... up -d backend`.
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
    volumes:
      - /srv/manhwamaniacs/data:/data
      # APK / IPA drop-in (populated by the mobile build pipeline — 1c). Dirs
      # are created empty by deploy.sh so a missing artifact reads as
      # "not built yet" rather than a broken mount.
      - /srv/manhwamaniacs/apk:/app/apk:ro
      - /srv/manhwamaniacs/ipa:/app/ipa:ro
      - ../../mobile/pubspec.yaml:/app/mobile/pubspec.yaml:ro
      # App icon + marketing screenshots for /app/media (SideStore listing and
      # the install landing page).
      - ../../mobile/docs/screenshots:/app/mobile/screenshots:ro
    networks: [edge]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  frontend:
    build:
      context: ../../frontend
      args:
        NEXT_PUBLIC_API_URL: /api
        BACKEND_INTERNAL_URL: http://manhwamaniacs-backend:8000
        APP_ENV: production
        GIT_COMMIT: ${GIT_COMMIT:-dev}
        GIT_BRANCH: ${GIT_BRANCH:-feat/vps-slim-source-native}
    image: local/manhwamaniacs-frontend:latest
    container_name: manhwamaniacs-frontend
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    environment:
      - NODE_ENV=production
      - BACKEND_INTERNAL_URL=http://manhwamaniacs-backend:8000
    networks: [edge]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

networks:
  # The Minecraft stack's network — Caddy + cloudflared already live here.
  edge:
    external: true
    name: mcbots_bots
