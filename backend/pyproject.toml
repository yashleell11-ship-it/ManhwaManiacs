[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "manhwamaniacs-backend"
version = "0.1.0"
description = "ManhwaManiacs FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.138.2",
    "starlette==1.6.0",
    "uvicorn==0.49.0",
    "python-multipart==0.0.32",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "sqlalchemy==2.0.52",
    "alembic==1.18.5",
    "httpx==0.28.1",
    "curl_cffi==0.15.0",
    "argon2-cffi==25.1.0",
    "slowapi==0.1.10",
    "pillow==12.3.0",
    "av==18.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["api*", "connectors*", "core*", "database*", "routes*", "services*", "utils*"]
exclude = ["tests*", "scripts*", "venv*"]

[tool.setuptools]
py-modules = ["main", "bootstrap"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: live network tests against external APIs",
    "real_auth: opt out of the default-admin test auth; exercise real auth/401",
    "rate_limit: enable the inbound rate limiter for this test (off elsewhere)",
]
