name: Build iOS (unsigned, for sideload)

# Builds an unsigned iOS .ipa on GitHub's free cloud Mac.
# No Apple Developer account needed. The .ipa is downloadable from the run's
# "Artifacts" section, then installed on-device via SideStore / AltStore.
#
# Runs automatically on every push to the branch below, and can also be
# started by hand from the repo's Actions tab (workflow_dispatch).

on:
  push:
    branches:
      - feat/vps-slim-source-native
  workflow_dispatch:

jobs:
  # The full backend/frontend/mobile suite. Gating the PUBLISH step on this is
  # the point: a push to this branch puts an .ipa on the phone within 15 minutes
  # (mm-fetch-ios.timer polls /releases/latest, and the build number is
  # 1000 + run_number so it always beats whatever is installed). Before this,
  # a mid-work push shipped itself with zero tests run and no way to roll an
  # .ipa back.
  tests:
    uses: ./.github/workflows/tests.yml

  build-ios:
    needs: tests
    # Build even when the suite is red. `needs` alone would skip this job, and a
    # failing test would then cost a Mac build nobody can reproduce locally —
    # there is no Mac in this project. So: always build and upload the artifact,
    # and let only the release step care about the verdict.
    if: always()
    runs-on: macos-latest
    # Needed to publish the .ipa as a release asset (see the last step for why a
    # release rather than just an artifact).
    permissions:
      contents: write
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Resolve build version
        # SideStore only offers an update when the advertised version/build beats
        # the installed one, so every run must produce a strictly higher build
        # number — otherwise new code lands in the .ipa and no phone is ever told.
        #
        # The version *name* stays hand-managed in the pubspec; only the build
        # number is automatic. github.run_number increments once per run of this
        # workflow, and the 1000 base keeps it permanently clear of the hand-set
        # pubspec build numbers the Android channel uses.
        #
        # Caveat: renaming or deleting this workflow file resets run_number to 1,
        # which would make the build number go backwards and silence the update
        # badge until it caught up. Raise the base here if that ever happens.
        id: ver
        run: |
          NAME="$(sed -n 's/^version: *\([^+ ]*\).*/\1/p' pubspec.yaml | head -1)"
          if [ -z "$NAME" ]; then
            echo "::error::could not parse 'version:' from mobile/pubspec.yaml"
            exit 1
          fi
          NUMBER=$(( 1000 + ${{ github.run_number }} ))
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"
          echo "building $NAME ($NUMBER)"

      - name: Build unsigned iOS app
        # `flutter build ios` runs `pod install`; --no-codesign skips Apple signing.
        # The dart-defines mirror the production APK build (see mobile/RELEASE.md):
        # without them the app defaults to FLAVOR=dev + http://127.0.0.1:8000,
        # which on a phone is nothing, and would allow a clear-text bearer token.
        # --build-name/--build-number land in the .app's Info.plist, which is what
        # SideStore reads back to decide whether an update is already installed.
        run: >
          flutter build ios --release --no-codesign
          --build-name=${{ steps.ver.outputs.name }}
          --build-number=${{ steps.ver.outputs.number }}
          --dart-define=FLAVOR=prod
          --dart-define=API_URL=https://app.manhwamaniacs.xyz

      - name: Inspect the built app
        # Nobody here owns a Mac, so this log is the only place the build is ever
        # looked at. Purely informational — it must not be able to fail the run.
        # On a first-ever iOS build the Frameworks listing is the fastest way to
        # confirm ios/Podfile's PICKER_MEDIA=false took effect: there should be
        # no DKImagePickerController / SDWebImage / TOCropViewController.
        if: always()
        continue-on-error: true
        run: |
          echo "--- Runner.app/Info.plist ---"
          /usr/libexec/PlistBuddy -c "Print" build/ios/iphoneos/Runner.app/Info.plist || true
          echo "--- Frameworks embedded in Runner.app ---"
          ls build/ios/iphoneos/Runner.app/Frameworks 2>/dev/null || echo "(none)"
          echo "--- ios/Podfile.lock (commit this into mobile/ios/ to pin CI) ---"
          cat ios/Podfile.lock 2>/dev/null || echo "(no Podfile.lock produced)"

      - name: Package unsigned .ipa
        # An .ipa is just a zip with the .app inside a Payload/ folder.
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/Runner.app
          zip -r9 ManhwaManiacs.ipa Payload

      - name: Write build metadata
        # The numbers that went into this binary travel next to it: the server
        # can't read a version out of an .ipa, and its own pubspec checkout knows
        # nothing about the build number stamped above. app_distribution.py reads
        # this file to fill in the SideStore manifest.
        run: |
          cat > build/ios/iphoneos/ios-build.json <<JSON
          {
            "version": "${{ steps.ver.outputs.name }}",
            "buildVersion": "${{ steps.ver.outputs.number }}",
            "date": "$(date -u +%Y-%m-%d)",
            "commit": "${{ github.sha }}",
            "runId": "${{ github.run_id }}"
          }
          JSON
          cat build/ios/iphoneos/ios-build.json

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: ManhwaManiacs-ipa
          path: |
            mobile/build/ios/iphoneos/ManhwaManiacs.ipa
            mobile/build/ios/iphoneos/ios-build.json
          if-no-files-found: error

      - name: Verify the .ipa is what we claimed
        # Runs AFTER the upload on purpose: if an assertion here is wrong, the
        # run still goes red but the .ipa is already downloadable by hand, so a
        # bad check can never cost a build on a machine nobody can reproduce.
        #
        # What it guards, both of which fail silently and days late otherwise:
        #   * the version/build actually stamped into the binary. If these drift
        #     from ios-build.json, /app/source.json advertises a build that is
        #     not in the .ipa and SideStore's update badge lies — that is the
        #     "SideStore offers no update" row in mobile/docs/IOS_SIDELOAD.md.
        #   * the purpose strings. A missing one is not a warning on iOS, it is
        #     a process kill the moment the matching framework is touched, and
        #     on a sideloaded build that looks exactly like a lapsed cert.
        run: |
          set -euo pipefail
          PLIST=build/ios/iphoneos/Runner.app/Info.plist
          pb() { /usr/libexec/PlistBuddy -c "Print :$1" "$PLIST"; }

          GOT_NAME="$(pb CFBundleShortVersionString)"
          GOT_NUMBER="$(pb CFBundleVersion)"
          echo "built: $GOT_NAME ($GOT_NUMBER)"
          [ "$GOT_NAME" = "${{ steps.ver.outputs.name }}" ] \
            || { echo "::error::CFBundleShortVersionString is $GOT_NAME, expected ${{ steps.ver.outputs.name }}"; exit 1; }
          [ "$GOT_NUMBER" = "${{ steps.ver.outputs.number }}" ] \
            || { echo "::error::CFBundleVersion is $GOT_NUMBER, expected ${{ steps.ver.outputs.number }}"; exit 1; }

          for key in NSPhotoLibraryUsageDescription NSAppleMusicUsageDescription; do
            pb "$key" >/dev/null 2>&1 \
              || { echo "::error::$key missing from the built Info.plist"; exit 1; }
          done
          echo "purpose strings present"

      - name: Publish the .ipa as a release asset
        # THE GATE: a release is what reaches the phone, so it requires a green
        # suite. The build above ran regardless, so a red run still leaves a
        # downloadable artifact for anyone who wants to inspect it — it just
        # never becomes an update SideStore will offer.
        if: needs.tests.result == 'success'
        # GitHub requires authentication to download a workflow *artifact*, even
        # on a public repo — so the NAS could not fetch a build without a PAT
        # minted and stored as root. Release assets on a public repo are
        # anonymously downloadable, which lets ops/fetch-ios-build.sh run with no
        # credentials at all.
        #
        # One release per build number, so /releases/latest always resolves to
        # the newest build and the fetch script needs no tag bookkeeping. The
        # build number is monotonic (1000 + run_number), so tags never collide.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="ios-build-${{ steps.ver.outputs.number }}"
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "iOS ${{ steps.ver.outputs.name }} (build ${{ steps.ver.outputs.number }})" \
            --notes "Unsigned iOS build for SideStore sideloading. Commit ${{ github.sha }}." \
            build/ios/iphoneos/ManhwaManiacs.ipa \
            build/ios/iphoneos/ios-build.json
          # Podfile.lock rides along when pod install produced one, so it can be
          # retrieved and committed without a token either. Uploaded separately,
          # and guarded, because a missing lockfile must not fail a build that
          # otherwise succeeded. (Kept array-free: the runner's /bin/bash is 3.2,
          # where an empty "${arr[@]}" is an unbound-variable error under set -u.)
          if [ -f ios/Podfile.lock ]; then
            gh release upload "$TAG" ios/Podfile.lock --repo "${{ github.repository }}"
          fi

      - name: Upload Podfile.lock
        # There is no Mac in this project, so the ONLY way to obtain a real
        # Podfile.lock is to let the cloud runner generate one and hand it back.
        # Download this from the run's Artifacts, drop it in mobile/ios/ and
        # commit it — from then on CI resolves pods identically every run.
        # Separate from the .ipa artifact so a missing lockfile can never break
        # the download the phone actually needs.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-podfile-lock
          path: mobile/ios/Podfile.lock
          if-no-files-found: warn
